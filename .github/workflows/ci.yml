name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run scripts/ci.sh
        run: ./scripts/ci.sh

  smoke-app:
    # A brand-new app requires this module in go.mod, imports its runtime,
    # generates its db code with sqlc and runs the fixture checks and -check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install sqlc v1.31.1
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: scripts/smoke-app.sh (replace to this checkout)
        run: ./scripts/smoke-app.sh
      - name: setup-bridge-en against the real public module (no replace, hits github.com)
        run: |
          set -euo pipefail
          for m in go-install release; do
            BRIDGE_EN_VERSION=0.1.0 BRIDGE_EN_METHOD=$m BRIDGE_EN_BIN_DIR="$RUNNER_TEMP/bin-$m" \
              bash .github/actions/setup-bridge-en/install.sh
          done
      - name: scripts/smoke-app.sh --go-install (go get + setup-bridge-en install.sh from a tagged mirror)
        run: ./scripts/smoke-app.sh --go-install

  en-comment:
    # The same mechanism apps use: bridge-en pr-comment, posted by the
    # pr-english action, over the fixture slices. One comment, updated in place.
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build bridge-en from this checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/bridge-en" ./cmd/bridge-en
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Comment intent and English of the changed fixture slices
        uses: ./.github/actions/pr-english
        with:
          features: "adapter/testdata/good/*/"
