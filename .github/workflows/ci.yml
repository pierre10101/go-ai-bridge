name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run scripts/ci.sh
        run: ./scripts/ci.sh

  smoke-app:
    # A brand-new app requires this module in go.mod, imports its runtime,
    # generates its db code with sqlc and runs the fixture checks and -check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install sqlc v1.31.1
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: scripts/smoke-app.sh (replace to this checkout)
        run: ./scripts/smoke-app.sh
      - name: setup-bridge-en against the real public module (no replace, hits github.com)
        run: |
          set -euo pipefail
          for m in go-install release; do
            BRIDGE_EN_VERSION=0.1.0 BRIDGE_EN_METHOD=$m BRIDGE_EN_BIN_DIR="$RUNNER_TEMP/bin-$m" \
              bash .github/actions/setup-bridge-en/install.sh
          done
      - name: scripts/smoke-app.sh --go-install (go get + setup-bridge-en install.sh from a tagged mirror)
        run: ./scripts/smoke-app.sh --go-install

  en-comment:
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comment .en diff on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- bridge-en-diff -->'
          SHORT="${BASE_SHA:0:7}"
          # GitHub issue comment body limit is 65536; leave headroom for marker/wrapping
          MAX_DIFF_CHARS=60000

          # git diff exits 1 when files differ; capture output either way
          set +e
          diff_out=$(git diff --no-ext-diff --unified=3 "${BASE_SHA}"...HEAD -- 'adapter/testdata/good/**/*.en')
          set -e

          if [ -z "${diff_out}" ]; then
            body=$(printf '%s\n\nNo `.en` file changes in this PR (compared to `%s`).' "${MARKER}" "${SHORT}")
          else
            trunc_note=""
            if [ "${#diff_out}" -gt "${MAX_DIFF_CHARS}" ]; then
              diff_out="${diff_out:0:${MAX_DIFF_CHARS}}"
              trunc_note=$(printf '\n\n> **Note:** Diff truncated for the GitHub comment size limit (~65k). See the full `.en` changes under **Files changed**.')
            fi
            body=$(printf '%s\n\nGolden English (`adapter/testdata/good/**/*.en`) changes vs base `%s`:\n\n```diff\n%s\n```%s' "${MARKER}" "${SHORT}" "${diff_out}" "${trunc_note}")
          fi

          # Idempotent: update existing bot comment with marker, else create
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"${MARKER}\"))) | .id" \
            | head -n1 || true)

          payload=$(jq -n --arg body "$body" '{body: $body}')
          if [ -n "${existing}" ]; then
            echo "$payload" | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input -
            echo "Updated comment ${existing}"
          else
            echo "$payload" | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input -
            echo "Created new .en diff comment"
          fi
